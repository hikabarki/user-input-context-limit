# token-flow-extender model registry (hot-reloadable).
#
# This file is the THIRD step of the limit resolution chain:
#   1. explicit max_input_tokens parameter
#   2. live endpoint probe (/v1/models -> max_model_len)
#   3. this registry
#   4. HF config introspection (max_position_embeddings)
#   5. conservative fallback (config.fallback_max_input_tokens) + loud warning
#
# Values below mirror the Keural platform constants at the time of writing.
# Edit freely; the file is re-read automatically when its mtime changes.
# Keys are matched case-insensitively against the model name; "aliases" are
# alternative names that resolve to the same entry.

models:
  "openai/gpt-oss-120b":
    max_input_tokens: 120832
    max_output_tokens: 10240
    aliases: ["gpt-oss-120b", "gpt-oss-120"]

  "Qwen/Qwen3.5-35B-A3B":
    max_input_tokens: 496768
    max_output_tokens: 8192
    aliases: ["qwen", "Qwen/Qwen3.5-122B-A10B-FP8"]

  "google/gemma-4-26B-A4B-it":
    max_input_tokens: 245760
    max_output_tokens: 16384
    aliases: ["gemma", "RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic"]

  "gpt-5-nano":
    max_input_tokens: 270000
    max_output_tokens: 32768
    aliases: ["nano"]

  "keural-alpha":
    # NOTE: the host platform defines only a TOTAL cap of 1024 for this model.
    # We split it conservatively here; adjust when the owning team publishes
    # real input/output limits. See AUDIT_REPORT.md findings B1 and B7.
    max_input_tokens: 768
    max_output_tokens: 256
    aliases: ["keural"]
